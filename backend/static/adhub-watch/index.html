<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>广告</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    }
    #screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #000;
    }
    #screen.ready { display: flex; }
    #mediaBox {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }
    #mediaBox img,
    #mediaBox video {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }
    #tapArea {
      position: absolute;
      inset: 0;
      z-index: 2;
    }
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(10px, env(safe-area-inset-top)) 12px 28px;
      background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }
    .ad-badge {
      pointer-events: auto;
      font-size: 11px;
      line-height: 1;
      color: rgba(255,255,255,.92);
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 4px;
      padding: 4px 6px;
      letter-spacing: .5px;
    }
    .skip-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border-radius: 14px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.22);
      color: #fff;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .skip-pill .sec {
      min-width: 18px;
      text-align: center;
      font-weight: 600;
    }
    .skip-pill .divider {
      display: none;
      width: 1px;
      height: 14px;
      margin: 0 10px;
      background: rgba(255,255,255,.28);
    }
    .skip-pill .skip-btn {
      display: none;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 13px;
      padding: 0;
      line-height: 1;
    }
    .skip-pill.can-skip .divider,
    .skip-pill.can-skip .skip-btn { display: block; }
    .bottom-shade {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 120px;
      background: linear-gradient(0deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
      z-index: 3;
    }
    #loading, #fatal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: rgba(255,255,255,.7);
      font-size: 14px;
    }
    #fatal { display: none; }
    #fatal.show { display: flex; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255,255,255,.15);
      border-top-color: rgba(255,255,255,.85);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #dialogMask {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.5);
      padding: 32px;
    }
    #dialogMask.open { display: flex; }
    .dialog {
      width: min(280px, 100%);
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      text-align: center;
    }
    .dialog-title {
      padding: 22px 20px 8px;
      font-size: 17px;
      font-weight: 600;
      color: #111;
    }
    .dialog-desc {
      padding: 0 20px 20px;
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }
    .dialog-actions {
      display: flex;
      border-top: 1px solid #eee;
    }
    .dialog-actions button {
      flex: 1;
      border: none;
      background: #fff;
      padding: 14px 0;
      font-size: 16px;
    }
    .dialog-actions button + button {
      border-left: 1px solid #eee;
    }
    #dlgContinue { color: #111; font-weight: 600; }
    #dlgSkip { color: #666; }
    #endMask {
      position: fixed;
      inset: 0;
      z-index: 15;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
    }
    #endMask.fade { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div></div>
  <div id="fatal"></div>

  <div id="screen">
    <div id="mediaBox">
      <div id="tapArea" aria-label="广告"></div>
      <div class="bottom-shade"></div>
    </div>
    <div class="top-bar">
      <span class="ad-badge">广告</span>
      <div class="skip-pill" id="skipPill">
        <span class="sec" id="secNum">--</span>
        <span class="divider"></span>
        <button type="button" class="skip-btn" id="skipBtn">跳过</button>
      </div>
    </div>
  </div>

  <div id="dialogMask">
    <div class="dialog">
      <div class="dialog-title">要跳过这条广告吗？</div>
      <div class="dialog-desc">继续观看即可正常完成推广</div>
      <div class="dialog-actions">
        <button type="button" id="dlgSkip">跳过</button>
        <button type="button" id="dlgContinue">继续观看</button>
      </div>
    </div>
  </div>
  <div id="endMask"></div>

  <script>
    (function () {
      var SKIP_AFTER = 5;
      var params = new URLSearchParams(location.search);
      var code = params.get("code");

      var loadingEl = document.getElementById("loading");
      var fatalEl = document.getElementById("fatal");
      var screenEl = document.getElementById("screen");
      var mediaBox = document.getElementById("mediaBox");
      var tapArea = document.getElementById("tapArea");
      var secNum = document.getElementById("secNum");
      var skipPill = document.getElementById("skipPill");
      var skipBtn = document.getElementById("skipBtn");
      var dialogMask = document.getElementById("dialogMask");
      var dlgSkip = document.getElementById("dlgSkip");
      var dlgContinue = document.getElementById("dlgContinue");
      var endMask = document.getElementById("endMask");

      function showFatal(msg) {
        loadingEl.style.display = "none";
        fatalEl.textContent = msg;
        fatalEl.classList.add("show");
      }

      function exitPage() {
        if (window.history.length > 1) window.history.back();
        else window.close();
      }

      if (!code) {
        showFatal("广告加载失败");
        return;
      }

      var viewerKey = localStorage.getItem("adhub_viewer") || ("v_" + Math.random().toString(36).slice(2));
      localStorage.setItem("adhub_viewer", viewerKey);

      var session = null;
      var jumpUrl = "";
      var left = 30;
      var watchSec = 0;
      var timer = null;
      var browseTimer = null;
      var browseSec = 0;
      var clickedJump = false;
      var shakeUsed = false;
      var finished = false;
      var cancelled = false;
      var canSkip = false;

      function fixMediaUrl(url) {
        if (!url) return "";
        if (url.indexOf("127.0.0.1") >= 0 || url.indexOf("localhost") >= 0) {
          return location.origin + url.replace(/^https?:\/\/[^/]+/, "");
        }
        return url;
      }

      function parseRules() {
        var raw = session.validRules || session.validMode || "watch_time";
        var legacy = {
          time_ratio: ["watch_time"],
          click_jump: ["click_jump"],
          browse_sec: ["browse_sec"],
          complete_and_click: ["watch_full", "click_jump"],
          complete_click_browse: ["watch_full", "click_jump", "browse_sec"]
        };
        if (legacy[raw]) return legacy[raw];
        return String(raw).split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      }

      function hasRule(name) {
        return parseRules().indexOf(name) >= 0;
      }

      function needsBrowse() {
        return hasRule("browse_sec");
      }

      function stopTimers() {
        if (timer) { clearInterval(timer); timer = null; }
        if (browseTimer) { clearInterval(browseTimer); browseTimer = null; }
      }

      function startBrowseTrack() {
        if (browseTimer) return;
        browseTimer = setInterval(function () { browseSec += 1; }, 1000);
      }

      function doJump() {
        if (!jumpUrl) return;
        clickedJump = true;
        if (needsBrowse()) startBrowseTrack();
        window.location.href = jumpUrl;
      }

      tapArea.addEventListener("click", function () {
        if (finished || cancelled || dialogMask.classList.contains("open")) return;
        if (jumpUrl) doJump();
      });

      skipBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (!canSkip || finished || cancelled) return;
        dialogMask.classList.add("open");
      });

      dlgContinue.addEventListener("click", function () {
        dialogMask.classList.remove("open");
      });

      dlgSkip.addEventListener("click", function () {
        cancelled = true;
        stopTimers();
        dialogMask.classList.remove("open");
        exitPage();
      });

      function updateSkipUI() {
        secNum.textContent = String(Math.max(0, left));
        if (watchSec >= SKIP_AFTER && !canSkip) {
          canSkip = true;
          skipPill.classList.add("can-skip");
        }
      }

      function startCountdown() {
        left = session.durationSec || 30;
        watchSec = 0;
        canSkip = false;
        skipPill.classList.remove("can-skip");
        updateSkipUI();
        timer = setInterval(function () {
          left -= 1;
          watchSec += 1;
          updateSkipUI();
          if (left <= 0) {
            stopTimers();
            finish();
          }
        }, 1000);
      }

      function finish() {
        if (finished || cancelled) return;
        finished = true;
        endMask.classList.add("fade");
        var body = {
          code: code,
          viewerKey: viewerKey,
          durationSec: watchSec,
          clickedJump: clickedJump,
          browseSec: browseSec,
          shakeJumpUsed: shakeUsed
        };
        if (session.campaign && session.campaign.id) body.campaignId = session.campaign.id;
        fetch("/api/adhub/watch/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        })
          .finally(function () {
            setTimeout(exitPage, 320);
          });
      }

      function mountMedia(url, type) {
        var el;
        if (type === "video") {
          el = document.createElement("video");
          el.src = url;
          el.autoplay = true;
          el.playsInline = true;
          el.muted = true;
          el.setAttribute("webkit-playsinline", "true");
          el.setAttribute("x5-playsinline", "true");
          el.preload = "auto";
        } else {
          el = document.createElement("img");
          el.src = url;
          el.alt = "";
          el.draggable = false;
        }
        mediaBox.insertBefore(el, tapArea);
        if (type === "video") el.play().catch(function () {});
      }

      fetch("/api/adhub/watch/session?code=" + encodeURIComponent(code))
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          loadingEl.style.display = "none";
          if (!res.ok) {
            showFatal(res.d.detail || "广告加载失败");
            return;
          }
          session = res.d;
          jumpUrl = session.jumpUrl || (session.campaign && session.campaign.jumpUrl) || "";
          var mediaUrl = fixMediaUrl(session.mediaUrl || (session.campaign && session.campaign.mediaUrl) || "");
          var mediaType = session.mediaType || (session.campaign && session.campaign.mediaType) || "";
          if (mediaUrl) mountMedia(mediaUrl, mediaType === "video" ? "video" : "image");
          screenEl.classList.add("ready");
          startCountdown();
        })
        .catch(function () {
          showFatal("网络异常，请稍后重试");
        });
    })();
  </script>
</body>
</html>
